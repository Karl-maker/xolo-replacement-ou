# Local databases. Two SEPARATE Postgres servers, so tests can never reach development data.
#   pnpm db:up        start both        pnpm db:up:test   start only the test server
#   pnpm db:down      stop both (the dev data survives in a volume; the test server keeps nothing)
name: oum

services:
  # Development database: what the CLI uses. Its data survives restarts.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oum
    ports: ["127.0.0.1:5432:5432"] # bound to localhost only: the passwords here are not secret
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oum"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Test database: a different server on a different port, kept in memory and thrown away on stop.
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: oum_test
      POSTGRES_PASSWORD: oum_test
      POSTGRES_DB: oum_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    # Safe ONLY because the data is disposable: trade durability for speed.
    command:
      [
        "postgres",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oum_test -d oum_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
    name: oum-pgdata # the same name the earlier `docker run` command used, so existing dev data is kept
